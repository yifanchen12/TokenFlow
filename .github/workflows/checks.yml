name: Windows checks and executable
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install pyinstaller==6.22.3 pypdf rapidocr_onnxruntime==1.2.3 PyMuPDF Pillow
      - name: Run checks
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import ui_page; print(ui_page.PAGE.split('<script>',1)[1].split('</script>',1)[0])" | node --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/test_ui.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tokenflow.py --self-check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python eval_workflow.py --self-check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python eval_workflow.py --cases eval_cases.repository.json --report tmp/offline.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import json; r=json.load(open('tmp/offline.json',encoding='utf-8')); assert r['summary']['cases']==60 and r['summary']['critical_fact_loss_rate']==0"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Synthetic corpus and task-context checks
        shell: pwsh
        run: |
          python scripts/generate_eval_cases.py --output-dir tmp/synthetic-eval
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python eval_workflow.py --cases tmp/synthetic-eval/all.json --report tmp/synthetic-direct.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python eval_workflow.py --cases tmp/synthetic-eval/all.json --offline-task-context --report tmp/synthetic-context.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python eval_workflow.py --cases eval_cases.repository.json --offline-task-context --report tmp/repository-context.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import json; pairs=[('tmp/synthetic-direct.json',120),('tmp/synthetic-context.json',120),('tmp/repository-context.json',60)]; reports=[(json.load(open(p,encoding='utf-8')),n) for p,n in pairs]; assert all(r['summary']['cases']==n and r['summary']['critical_fact_loss_rate']==0 and r['quality_gate']['status']=='not_evaluated' for r,n in reports)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and smoke-test EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TokenFlow --collect-all rapidocr_onnxruntime --exclude-module torch --exclude-module pandas --exclude-module scipy --exclude-module pytest --exclude-module matplotlib --exclude-module tensorflow --exclude-module transformers launcher.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/smoke_exe.ps1
          $hash = (Get-FileHash dist/TokenFlow.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TokenFlow.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: TokenFlow-windows
          path: |
            dist/TokenFlow.exe
            dist/SHA256SUMS.txt
